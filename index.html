<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary's Video Select Tool</title>
    <link rel="stylesheet" href="style.css" />
    
</head>
<body>

    <h1>Mary's Video Selection Review 📹 Tool</h1>
    <p>Please review the videos below. Mark the files that should be deleted, then use the sidebar to submit the final list to the administrator.</p>
   
    <div class="layout">
        <!-- Video List -->
        <div class="video-container" id="video-list">Loading videos from text.txt...</div>

        <!-- Submission Sidebar -->
        <div class="sidebar">
            <h3>📝 Selection Summary</h3>
            <div id="marked-count" style="font-weight: 600; color: #57606a;">0 files selected</div>
            <textarea id="marked-list-text" readonly placeholder="No files selected yet..."></textarea>
            <button class="btn submit-btn" onclick="submitList()">📧 Send List to Admin</button>
        </div>
    </div>

<!-- Comments ***** -->

    

<script src="main.js"></script>

</body>
</html>
